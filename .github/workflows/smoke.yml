name: Smoke

# Fast check (unit + contract, @smoke, and @characterization incl. golden master) on every push to main and every pull request.
# The full regression runs on a schedule in weekend-e2e.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit and contract tests
        run: npm run test:unit

      - run: npx playwright install --with-deps chromium

      # One Playwright run (not two) so results.json, the HTML report and Allure results cover
      # everything; a second run would overwrite the first run's report.
      - name: Run smoke and characterization tests (incl. golden master)
        run: npx playwright test --grep "@smoke|@characterization"

      - name: Test summary
        if: always()
        run: node scripts/summary.mjs

      # Always uploaded (not only on failure) so a green run can be inspected too.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
