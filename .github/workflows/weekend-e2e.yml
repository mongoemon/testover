name: Weekend E2E

on:
  schedule:
    # Sat & Sun 02:00 UTC = 09:00 Thailand (cron is always UTC)
    - cron: '0 2 * * 6,0'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      # After Playwright on purpose: a unit failure must not hide the E2E result, and the
      # report contract needs the real results.json (REQUIRE_REAL_REPORT makes a missing one fail).
      - name: Unit and contract tests
        if: always()
        run: npm run test:unit
        env:
          REQUIRE_REAL_REPORT: '1'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Notify result
        if: always()
        run: node scripts/notify.mjs
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
