name: Publish site

# Publishes the demo app at "/", docs/ at /docs, and the latest Allure and Playwright reports
# (hub page at /status/) to Cloudflare Pages.
# Does not touch weekend-e2e.yml or smoke.yml: it only reads the artifacts that
# Weekend E2E already uploads (allure-report, playwright-report).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the project
# name comes from the optional repo variable CLOUDFLARE_PROJECT_NAME (default: testover).
on:
  workflow_run:
    workflows: ['Weekend E2E']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/pages/**'
      - 'app/**'
      - 'scripts/build-pages.mjs'
      - 'README.md'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # download artifacts from the Weekend E2E run

# One deploy at a time; never cancel a deploy that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Find the Weekend E2E run to take reports from
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            id="${{ github.event.workflow_run.id }}"
          else
            # push / manual: reuse the newest finished run, so a docs-only
            # push does not wipe the reports already published.
            id=$(gh run list --workflow weekend-e2e.yml --repo "${{ github.repository }}" \
                   --limit 10 --json databaseId,status \
                   --jq '[.[] | select(.status=="completed")][0].databaseId // empty')
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          # Commit the reports were produced from (may differ from the commit being deployed).
          sha=""
          if [ -n "${id}" ]; then
            sha=$(gh run view "${id}" --repo "${{ github.repository }}" --json headSha --jq '.headSha // empty')
          fi
          echo "report_sha=${sha:-none}" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        env:
          SITE_SHA: ${{ github.sha }}
          REPORT_SHA: ${{ steps.run.outputs.report_sha }}
        run: |
          # "/" must stay the demo app (same output as `npm run build:pages`); the report hub lives at /status/.
          node scripts/build-pages.mjs
          cp -r dist _site
          mkdir -p _site/reports/allure _site/reports/playwright _site/status
          cp .github/pages/index.html _site/status/index.html
          # Stamp the commits on the landing page so a visitor knows which version they are looking at.
          sed -i \
            -e "s/__SITE_SHA_SHORT__/${SITE_SHA:0:7}/g" -e "s/__SITE_SHA__/${SITE_SHA}/g" \
            -e "s/__REPORT_SHA_SHORT__/${REPORT_SHA:0:7}/g" -e "s/__REPORT_SHA__/${REPORT_SHA}/g" \
            _site/status/index.html
          touch _site/.nojekyll

      - name: Download Allure report
        if: steps.run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: _site/reports/allure
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Download Playwright report
        if: steps.run.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: _site/reports/playwright-raw
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Finalize report folders
        run: |
          # The artifact holds playwright-report/ and test-results/; keep only the HTML report.
          if [ -d _site/reports/playwright-raw/playwright-report ]; then
            cp -r _site/reports/playwright-raw/playwright-report/. _site/reports/playwright/
          fi
          rm -rf _site/reports/playwright-raw
          # Placeholder when no report exists yet, so links never 404.
          for dir in allure playwright; do
            if [ ! -f "_site/reports/$dir/index.html" ]; then
              echo '<!doctype html><meta charset="utf-8"><title>No report yet</title><p>ยังไม่มีรายงาน — จะปรากฏหลังรัน Weekend E2E ครั้งถัดไป / No report yet: it appears after the next Weekend E2E run.</p>' > "_site/reports/$dir/index.html"
            fi
          done

      - name: Create the Cloudflare Pages project if it does not exist yet
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PROJECT_NAME || 'testover' }} --production-branch=main
        continue-on-error: true   # fails harmlessly when the project already exists

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'testover' }} --branch=main
