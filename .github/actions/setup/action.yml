name: Setup
description: Node 22 and npm ci, plus Playwright Chromium (browser cached by Playwright version) when asked

inputs:
  browser:
    description: "'true' to install Playwright Chromium"
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm ci
      shell: bash

    - name: Read the Playwright version
      if: inputs.browser == 'true'
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: inputs.browser == 'true'
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    # A cache hit restores the browser binary only; the OS libraries still have to be installed.
    - name: Install Chromium
      if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Install Chromium system libraries
      if: inputs.browser == 'true' && steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
